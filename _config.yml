# 并在下次登录时自动填充。这个文件必须能通过
# https://writer.drakeet.com/.well-known/apple-app-site-association 直接访问：
# HTTPS、不经重定向、文件名不带扩展名、内容是不含注释的纯 JSON。请不要移动、改名或给它加 front matter。
