# 界面文字（简体中文）。页面正文写在 content/ 里，这里只放模板用到的固定文字。
homeLink = "← 纯纯写作首页"
languageMenu = "语言"
notFoundTitle = "找不到这个页面"
notFoundBody = "这个地址没有对应的页面，可能已经移动或删除。"
notFoundHome = "回到纯纯写作首页"
# 页脚版权一行；主体默认是 company，页面可以在 front matter 里用 company 换掉（layouts/partials/footer.html）。
copyright = "版权所有：{{ .Company }}"
company = "苏州小白迷雾科技有限公司"
megabytes = "{{ .Count }} MB"
# 博客文章的末尾与博客列表页（layouts/partials/article-footer.html、layouts/_default/blog.html）。dateFormat 是 Go 的时间格式。
# 香港繁体与俄文还没有博客，不写这几项：将来有了这两种语言的文章而忘了补，构建会报缺少界面文字（警告即错误）。
dateFormat = "2006 年 1 月 2 日"
blogPublished = "发布日期："
blogUpdated = "更新日期："
dateSeparator = "　"
blogMore = "更多文章："
blogName = "纯纯写作博客"
