# 官网服务器的 SSH 设置，安装到 /etc/ssh/sshd_config.d/00-writer.conf。
# 文件名以 00 开头，排在云镜像自带的 50-cloud-init.conf 之前：sshd 对同一项取第一次读到的值，
# 后者可能写着 PasswordAuthentication yes。改完要用 ssh -v 从外部确认只剩公钥认证。
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
AllowUsers drakeet
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
